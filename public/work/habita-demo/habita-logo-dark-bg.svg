<!-- Logo Habita — export Illustrator, pour fond sombre. Deux retouches:
       1. la barre passe de #306fa3 a #2c70a5, la couleur de marque;
       2. la patte du bas commence 1.4 plus bas, pour que la barre ne la touche
          plus. ATTENTION AU SENS: ce rect est tourne de -90°, donc y = 61.465 - x.
          Son PIED tient a l'attribut x et ne doit jamais bouger — le toucher
          decolle la patte du bas du logo. C'est la LARGEUR qui regle son sommet,
          et le sommet vivait de toute facon cache sous la barre.
     La barre, elle, n'est pas deplacee: elle garde son ecart avec le montant de
     gauche. -->
